<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO 提醒测试</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            font-weight: 500;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }
        
        .status {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .status-connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .reminders-container {
            margin-top: 20px;
        }
        
        .reminders-container h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .reminder-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .reminder-item {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            animation: slideIn 0.3s ease;
            box-shadow: 0 4px 15px rgba(252, 182, 159, 0.3);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .reminder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .reminder-title {
            font-weight: 600;
            color: #8b4513;
            font-size: 16px;
        }
        
        .reminder-time {
            font-size: 12px;
            color: #a0522d;
            background: rgba(255,255,255,0.5);
            padding: 4px 8px;
            border-radius: 12px;
        }
        
        .reminder-content {
            color: #8b4513;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .reminder-meta {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .meta-tag {
            background: rgba(255,255,255,0.6);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #8b4513;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .instructions {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .instructions ol {
            color: #666;
            padding-left: 20px;
            line-height: 1.8;
        }
        
        .instructions li {
            margin-bottom: 8px;
        }
        
        code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📋 TODO 提醒服务测试</h1>
            
            <div class="form-group">
                <label for="token">JWT Token (登录后获取)</label>
                <input type="text" id="token" placeholder="请输入您的JWT Token">
            </div>
            
            <button class="btn" id="connectBtn" onclick="connect()">连接提醒服务</button>
            <button class="btn btn-danger" id="disconnectBtn" onclick="disconnect()" disabled style="margin-top: 10px;">断开连接</button>
            
            <div class="status status-disconnected" id="connectionStatus">
                状态: 未连接
            </div>
            
            <div class="reminders-container">
                <h2>📬 收到的提醒</h2>
                <div class="reminder-list" id="reminderList">
                    <div class="empty-state" id="emptyState">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        <p>暂无提醒，连接后等待提醒推送</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card instructions">
            <h3>📖 使用说明</h3>
            <ol>
                <li>首先调用登录接口获取 Token：<code>POST /api/token</code></li>
                <li>测试账号：<code>test@example.com</code> / <code>test123</code></li>
                <li>将获取到的 Token 输入到上方输入框</li>
                <li>点击"连接提醒服务"按钮建立 WebSocket 连接</li>
                <li>创建一个设置了提醒时间的 TODO（如提醒时间设为 0 分钟，截止日期设为当前时间之后）</li>
                <li>等待定时任务扫描（每分钟一次），收到提醒通知</li>
            </ol>
        </div>
    </div>

    <script>
        let ws = null;
        let reminderCount = 0;
        
        function connect() {
            const token = document.getElementById('token').value.trim();
            
            if (!token) {
                alert('请先输入 JWT Token');
                return;
            }
            
            const wsUrl = `ws://${window.location.host}/ws/reminders?token=${encodeURIComponent(token)}`;
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = function(event) {
                    updateConnectionStatus(true);
                    console.log('WebSocket 连接已建立');
                };
                
                ws.onmessage = function(event) {
                    console.log('收到消息:', event.data);
                    try {
                        const message = JSON.parse(event.data);
                        handleMessage(message);
                    } catch (e) {
                        console.error('解析消息失败:', e);
                    }
                };
                
                ws.onclose = function(event) {
                    updateConnectionStatus(false);
                    console.log('WebSocket 连接已关闭');
                };
                
                ws.onerror = function(error) {
                    console.error('WebSocket 错误:', error);
                    alert('连接失败，请检查 Token 是否正确');
                };
                
            } catch (error) {
                console.error('连接失败:', error);
                alert('连接失败');
            }
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('connectionStatus');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            
            if (connected) {
                statusEl.className = 'status status-connected';
                statusEl.textContent = '状态: 已连接 - 等待提醒...';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                statusEl.className = 'status status-disconnected';
                statusEl.textContent = '状态: 未连接';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }
        
        function handleMessage(message) {
            if (message.type === 'reminder') {
                addReminder(message);
                // 播放提醒音效或显示通知
                if (Notification.permission === 'granted') {
                    new Notification('TODO 提醒', {
                        body: message.message,
                        icon: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9IiNmN2E1MGYiIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTEyIDJjLTEuMSAwLTIgLjktMiAydjIuNzdjLTMuNTMuNzktNiAzLjQ1LTYgNy4yM3Y2aDEydjZjMCAzLjc4LTIuNDcgNi40NC02IDcuMjNWMjRjMCAxLjEuOSAyIDIgMnMyLS45IDItMnYtMi43N2MzLjUzLS43OSA2LTMuNDUgNi03LjIzdi02YzAtMy43OC0yLjQ3LTYuNDQtNi03LjIzVjRjMC0xLjEtLjktMi0yLTJ6Ii8+PC9zdmc+'
                    });
                }
            } else if (message.type === 'system') {
                console.log('系统消息:', message.message);
            } else if (message.type === 'pong') {
                console.log('心跳响应');
            }
        }
        
        function addReminder(reminder) {
            const emptyState = document.getElementById('emptyState');
            if (emptyState) {
                emptyState.remove();
            }
            
            reminderCount++;
            
            const list = document.getElementById('reminderList');
            const item = document.createElement('div');
            item.className = 'reminder-item';
            
            const priorityText = {
                1: '低优先级',
                2: '中优先级',
                3: '高优先级'
            };
            
            const dueDate = reminder.due_date ? new Date(reminder.due_date).toLocaleString('zh-CN') : '无截止日期';
            
            item.innerHTML = `
                <div class="reminder-header">
                    <span class="reminder-title">🔔 ${reminder.title}</span>
                    <span class="reminder-time">${new Date().toLocaleTimeString('zh-CN')}</span>
                </div>
                <div class="reminder-content">${reminder.message}</div>
                <div class="reminder-meta">
                    <span class="meta-tag">📌 ${reminder.content}</span>
                    <span class="meta-tag">⏰ 截止: ${dueDate}</span>
                    <span class="meta-tag">${priorityText[reminder.priority] || '未设置'}</span>
                </div>
            `;
            
            list.insertBefore(item, list.firstChild);
        }
        
        // 请求通知权限
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
        
        // 定时发送心跳
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);
    </script>
</body>
</html>
